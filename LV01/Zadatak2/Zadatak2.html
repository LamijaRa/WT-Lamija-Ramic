<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paket cokoladica</title>
  </head>

  <body>
    <h1>Forma: Napravi svoj paket cokoladica</h1>

    <form>
      <p>Izaberite vrstu cokoladice:</p>
      <input type="radio" id="dubai" name="cokoladica" value="dubai" />
      <label for="dubai">Dubai</label><br />

      <input type="radio" id="snickers" name="cokoladica" value="snickers" />
      <label for="snickers">Snickers</label><br />

      <input type="radio" id="mlijecna" name="cokoladica" value="mlijecna" />
      <label for="mlijecna">Mlijecna cokolada</label><br />

      <input type="radio" id="bijela" name="cokoladica" value="bijela" />
      <label for="bijela">Bijela cokolada</label>

      <p>
        <label for="velicina">Izaberite veličinu pakovanja:</label>
        <select id="velicina" name="velicina">
          <option value="100">100 g</option>
          <option value="250g">250 g</option>
          <option value="500g">500 g</option>
          <option value="1kg">1 kg</option>
          <option value="2kg">2 kg</option>
          <option value="2.5kg">2.5 kg</option>
        </select>
      </p>

      <p>Unesite vaše podatke za dostavu:</p>

      <p>
        <label for="imeIprezime">Ime i prezime:</label>
        <input type="text" id="imeIprezime" name="imeIprezime" />
      </p>

      <p>
        <label for="adresa">Adresa dostave:</label>
        <input type="text" id="adresa" name="adresa" />
      </p>

      <p>
        <label for="telefon">Broj telefona:</label>
        <input type="tel" id="telefon" name="telefon" />
      </p>

      <p>
        <button type="button">Naruči paket</button>
      </p>
    </form>
  </body>
</html>
